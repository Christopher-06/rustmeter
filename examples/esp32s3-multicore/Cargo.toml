[package]
edition = "2024"
name = "esp32s3-multicore"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "esp32s3-multicore"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "1.1.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["defmt", "embassy", "esp32s3"] }

defmt = "1.1.0"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32s3"] }
embassy-executor = { version = "0.10.0", features = ["defmt", "trace"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }

critical-section = "1.2.0"
static_cell = "2.1.1"
rustmeter-beacon = { version = "0.2.1", features = ["esp32s3", "defmt"], path = "../../rustmeter-beacon" }
# esp-hal-smartled = { version = "0.17.0", features = ["esp32s3"] }
embedded-io-async = "0.7.0"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
