[package]
name = "rustmeter-beacon"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Christopher Kock"]
description = "Lightweight tracing library for embedded Rust applications"
repository = "https://github.com/Christopher-06/rustmeter"
keywords = ["embedded", "tracing", "profiling", "no-std", "embassy"]
categories = ["embedded", "development-tools::profiling", "no-std"]
exclude = ["/debug", "/target", ".gitignore"]
readme = "../README.md"

[dependencies]
rustmeter-beacon-proc-macros = { path = "rustmeter-beacon-proc-macros", version = "0.2.0" }
rustmeter-beacon-core = { path = "rustmeter-beacon-core", version = "0.2.0" }
rustmeter-beacon-target = { path = "rustmeter-beacon-target", version = "0.2.0", optional = true }

defmt = { version = "1", optional = true }
portable-atomic = "1"

[features]
stm32 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/stm32"]
esp32 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32"]
esp32c2 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32c2"]
esp32c3 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32c3"]
esp32c6 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32c6"]
esp32h2 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32h2"]
esp32s2 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32s2"]
esp32s3 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/esp32s3"]
rp2040 = ["dep:rustmeter-beacon-target", "rustmeter-beacon-target/rp2040"]
defmt = ["dep:defmt", "rustmeter-beacon-target/defmt"]
std = ["rustmeter-beacon-core/std"]
